<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1">Mi Tienda</span>

        <span class="text-white">
            Carrito
            <span id="badge" class="badge bg-danger">0</span>
        </span>
    </nav>
    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card h-100">
                    <img src="./img/laptop.png" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text">$2.500.000</p>
                        <button 
                            class="btn btn-primary btn-agregar"
                            data-nombre="Laptop"
                            data-precio="2500000">
                            Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <img src="./img/mouse.png" class="card-img-top" alt="Mouse Gamer">
                    <div class="card-body">
                        <h5 class="card-title">Mouse Gamer</h5>
                        <p class="card-text">$120.000</p>
                        <button 
                            class="btn btn-primary btn-agregar"
                            data-nombre="Mouse Gamer"
                            data-precio="120000">
                            Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <img src="./img/teclado.png" class="card-img-top" alt="Teclado Mecánico">
                    <div class="card-body">
                        <h5 class="card-title">Teclado Mecánico</h5>
                        <p class="card-text">$250.000</p>
                        <button 
                            class="btn btn-primary btn-agregar"
                            data-nombre="Teclado Mecánico"
                            data-precio="250000">
                            Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card h-100">
                    <img src="./img/Monitor.png" class="card-img-top" alt="Monitor">
                    <div class="card-body">
                        <h5 class="card-title">Monitor</h5>
                        <p class="card-text">$850.000</p>
                        <button 
                            class="btn btn-primary btn-agregar"
                            data-nombre="Monitor"
                            data-precio="850000">
                            Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="container mt-5">
        <h2>Carrito de Compras</h2>
        <ul id="lista-carrito"></ul>
        <p>Total: $<span id="total">0</span></p>
        <button id="btn-vaciar" class="btn btn-success mb-5">Vaciar carrito</button>
    </div>
    <script src="./script.js"></script>
</body>
</html>
