<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> 
    <title>Document</title>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <h1>Task Manager</h1>
    </div>
    <div>
        <ul class="lista">
        <li class="bg-primary"><b>Total: <span id="total">0</span></b></li>
        <li class="bg-success"><b>Hechas: <span id="hechas">0</span></b></li>
        <li class="bg-danger"><b>Urgentes: <span id="urgentes" >0</span></b></li>
        <li class="bg-secondary"><b>Pendientes: <span id="pendientes">0</span></b></li>
        </ul>
    </div>
    <div class="card mb-4 container">
        <div class="card-body">
            <div class="row g-3" id="taskForm">
                <div class="col-md-8">
                    <input type="text" id="input" class="form-control" placeholder="Nueva tarea...">
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="categorySelect">
                        <option value="📌 General">📌 General</option>
                        <option value="💼 Trabajo">💼 Trabajo</option>
                        <option value="🏠 Casa">🏠 Casa</option>
                        <option value="📚 Estudio">📚 Estudio</option>
                        <option value="🏃 Ejercicio">🏃 Ejercicio</option>
                        <option value="🛒 Compras">🛒 Compras</option>
                    </select>
                </div>
                <div class="d-flex">
                    <button id="boton" class="btn btn-primary w-100">Agregar</button>
                </div>
            </div>
        </div>
    </div>
    <div class=" card container">
        <div class="card-body">
            <form class="row">
                <div class="col-md-8 mt-2">
                    <p>Mis Tareas</p>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="statusTask">
                        <option value="todas">Todas</option>
                        <option value="pendiente">Pendientes</option>
                        <option value="urgente">Urgente</option>
                        <option value="hecha">Hechas</option>
                    </select>
                </div>
            </form>
        </div> 
    </div>
    <div class="card container">
        <div class="tareas card-body">
            <p class="d-flex justify-content-center">Aún no hay tareas, agrega una!</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
